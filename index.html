<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter — Вход</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-bg">
                <div class="orb orb-1"></div>
                <div class="orb orb-2"></div>
                <div class="orb orb-3"></div>
            </div>

            <div class="auth-card">
                <div class="auth-header">
                    <div class="auth-logo">
                        <!-- Иконка Letter -->
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#667eea" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                            <polyline points="22,6 12,13 2,6"/>
                            <line x1="2" y1="18" x2="9" y2="11"/>
                            <line x1="22" y1="18" x2="15" y2="11"/>
                        </svg>
                        <h1>Letter</h1>
                    </div>
                    <p class="auth-subtitle">Современный защищённый мессенджер</p>
                </div>

                <div class="auth-tabs">
                    <button class="auth-tab active" data-tab="login">
                        <!-- Вход иконка -->
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                            <polyline points="10 17 15 12 10 7"/>
                            <line x1="15" y1="12" x2="3" y2="12"/>
                        </svg>
                        Вход
                    </button>
                    <button class="auth-tab" data-tab="register">
                        <!-- Регистрация иконка -->
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4-4v2"/>
                            <circle cx="8.5" cy="7" r="4"/>
                            <line x1="20" y1="8" x2="20" y2="14"/>
                            <line x1="23" y1="11" x2="17" y2="11"/>
                        </svg>
                        Регистрация
                    </button>
                </div>

                <div class="auth-panel active" id="panel-login">
                    <form id="login-form">
                        <div class="form-group">
                            <label>Телефон</label>
                            <input type="tel" id="login-phone" placeholder="+79991234567">
                        </div>
                        <div class="form-group">
                            <label>Пароль</label>
                            <div class="password-input">
                                <input type="password" id="login-password" placeholder="Введите пароль">
                                <button type="button" class="toggle-password" data-target="login-password">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                        <circle cx="12" cy="12" r="3"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-full">
                            Войти
                        </button>
                    </form>
                </div>

                <div class="auth-panel" id="panel-register">
                    <form id="register-form">
                        <div class="form-group">
                            <label>Телефон</label>
                            <input type="tel" id="register-phone" placeholder="+79991234567">
                        </div>
                        <div class="form-group">
                            <label>Имя</label>
                            <input type="text" id="register-username" placeholder="Ваше имя">
                        </div>
                        <div class="form-group">
                            <label>Пароль</label>
                            <div class="password-input">
                                <input type="password" id="register-password" placeholder="Минимум 6 символов">
                                <button type="button" class="toggle-password" data-target="register-password">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                        <circle cx="12" cy="12" r="3"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Повторите пароль</label>
                            <div class="password-input">
                                <input type="password" id="register-password-confirm" placeholder="Повторите пароль">
                                <button type="button" class="toggle-password" data-target="register-password-confirm">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                        <circle cx="12" cy="12" r="3"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-full">
                            Создать аккаунт
                        </button>
                    </form>
                </div>

                <div id="auth-message" class="auth-message"></div>

                <div class="auth-footer">
                    <span>© 2026 Letter</span>
                    <span>Версия 2.0.0</span>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { login, register, checkConnection } from './api.js';

        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const messageEl = document.getElementById('auth-message');

        function showMessage(text, type = 'error') {
            messageEl.textContent = text;
            messageEl.className = `auth-message ${type}`;
            messageEl.style.display = 'block';
            setTimeout(() => { messageEl.style.display = 'none'; }, 5000);
        }

        // Проверка API
        checkConnection().then(result => {
            if (result.status === 'error') {
                showMessage('⚠️ Сервер не отвечает. Запустите app.py', 'error');
            } else {
                showMessage('✅ Сервер работает', 'success');
            }
        });

        // Показ/скрытие пароля
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', function() {
                const input = document.getElementById(this.dataset.target);
                if (input.type === 'password') {
                    input.type = 'text';
                    this.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                        <line x1="1" y1="1" x2="23" y2="23"/>
                    </svg>`;
                } else {
                    input.type = 'password';
                    this.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>`;
                }
            });
        });

        // Вход
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const phone = document.getElementById('login-phone').value.trim();
            const password = document.getElementById('login-password').value;

            if (!phone || !password) {
                showMessage('Заполните все поля', 'error');
                return;
            }

            const result = await login(phone, password);
            
            if (result.success) {
                showMessage('✅ Вход выполнен!', 'success');
                setTimeout(() => window.location.href = 'dashboard.html', 500);
            } else {
                showMessage(result.error || 'Ошибка входа', 'error');
            }
        });

        // Регистрация
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const phone = document.getElementById('register-phone').value.trim();
            const username = document.getElementById('register-username').value.trim() || phone;
            const password = document.getElementById('register-password').value;
            const confirm = document.getElementById('register-password-confirm').value;

            if (!phone || !password) {
                showMessage('Заполните все поля', 'error');
                return;
            }

            if (password.length < 6) {
                showMessage('Пароль минимум 6 символов', 'error');
                return;
            }

            if (password !== confirm) {
                showMessage('Пароли не совпадают', 'error');
                return;
            }

            const result = await register(phone, password, username);
            
            if (result.success) {
                showMessage('✅ Аккаунт создан! Войдите в систему', 'success');
                document.querySelector('[data-tab="login"]').click();
                document.getElementById('login-phone').value = phone;
            } else {
                showMessage(result.error || 'Ошибка регистрации', 'error');
            }
        });

        // Переключение вкладок
        document.querySelectorAll('.auth-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.auth-panel').forEach(p => p.classList.remove('active'));
                this.classList.add('active');
                document.getElementById(`panel-${this.dataset.tab}`).classList.add('active');
                messageEl.style.display = 'none';
            });
        });

        if (localStorage.getItem('letter_token')) {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
                                        </html>
